[workspace]
resolver = "3"
members = ["crates/sir", "crates/sir_codegen_fear", "crates/sir_interp", "crates/sir_reader", "crates/sirc"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sir = { path = "crates/sir" }
sir_codegen_fear = { path = "crates/sir_codegen_fear" }
sir_reader = { path = "crates/sir_reader" }

serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
pretty_env_logger = "0.5.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
target-lexicon = "0.13.5"

fear = { git = "https://github.com/segfreak/fear.git", branch = "dev", features = ["serde"] }
