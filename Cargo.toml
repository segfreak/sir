[workspace]
resolver = "3"
members = ["crates/sir", "crates/sir_codegen_fear", "crates/sir_interp", "crates/sir_reader"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sir = { path = "crates/sir" }
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
